name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install iOS dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/ClosetLocal.xcworkspace \
            -scheme ClosetLocal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ClosetLocal.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload ClosetLocal-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClosetLocal-unsigned-ipa
          path: build/ClosetLocal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

