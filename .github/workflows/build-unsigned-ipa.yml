name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Add Core ML diffusion runtime
        run: ruby scripts/add-stable-diffusion-package.rb ios/ClosetLocal.xcodeproj

      - name: Download bundled local diffusion model
        run: |
          python3 -m venv build/hf-venv
          build/hf-venv/bin/pip install --quiet huggingface_hub
          build/hf-venv/bin/python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('apple/coreml-stable-diffusion-2-1-base', allow_patterns=['split_einsum/compiled/**'], local_dir='build/StableDiffusion')
          PY

      - name: Install iOS dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned app
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace ios/ClosetLocal.xcworkspace \
            -scheme ClosetLocal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ClosetLocal.app"
          test -d "$APP_PATH"
          cp -R build/StableDiffusion/split_einsum/compiled "$APP_PATH/StableDiffusion"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload ClosetLocal-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClosetLocal-unsigned-ipa
          path: build/ClosetLocal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
