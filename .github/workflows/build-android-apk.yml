name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Pin compatible Kotlin version
        run: |
          echo 'android.kotlinVersion=1.9.25' >> android/gradle.properties
          echo 'suppressKotlinVersionCompatibilityCheck=true' >> android/gradle.properties
          sed -i -E "s/^[[:space:]]*kotlinVersion = .*/        kotlinVersion = '1.9.25'/" android/build.gradle
          sed -i "s#org.jetbrains.kotlin:kotlin-gradle-plugin')#org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')#" android/build.gradle
          grep -n "kotlin" android/build.gradle

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace -Pandroid.kotlinVersion=1.9.25 assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosetLocal-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
